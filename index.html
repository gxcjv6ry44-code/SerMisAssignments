<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchard Assignments</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --line: #e3e5e8;
      --text: #1d232a;
      --muted: #68707a;
      --accent: #2d6a4f;
      --accent-soft: #eaf5ef;
      --danger: #a12626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      overflow: hidden;
    }
    .header {
      padding: 18px 20px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 180px 150px;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      align-items: end;
    }
    .field {
      position: relative;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input,
    .field select,
    .modal input,
    .modal select,
    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }
    .field input:focus,
    .field select:focus,
    .modal input:focus,
    .modal select:focus {
      outline: none;
      border-color: #7aa58c;
      box-shadow: 0 0 0 3px rgba(45,106,79,.12);
    }
    button {
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      border-color: var(--accent);
      font-weight: 600;
    }
    button:hover { filter: brightness(.96); }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: #cfd5db;
    }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-manage {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      width: auto;
    }
    .btn-manage:hover { background: var(--accent-soft); filter: none; }
    .status {
      padding: 12px 20px 0;
      min-height: 32px;
      font-size: 14px;
      color: var(--muted);
    }
    .error {
      color: var(--danger);
      font-weight: 600;
    }
    .board-meta {
      padding: 6px 20px 16px;
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 0 20px 20px;
    }
    .column {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }
    .column h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 18px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--line);
    }
    .slot {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .slot:hover {
      background: #fafcfa;
    }
    .slot:last-child { border-bottom: none; }
    .slot-num {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .slot-name.empty {
      color: #98a1aa;
      font-style: italic;
    }
    .helper {
      padding: 0 20px 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      border: 1px solid var(--line);
      overflow: visible;
      position: relative;
    }
    .modal-header {
      padding: 16px 18px 10px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .modal-sub {
      color: var(--muted);
      font-size: 13px;
    }
    .modal-body {
      padding: 16px 18px;
      overflow: visible;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 0 18px 18px;
    }
    .modal-actions.two-col {
      grid-template-columns: 1fr 1fr;
    }
    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid #cfd5db;
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
    }
    .suggestions.open {
      display: block;
    }
    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eef1f3;
      font-size: 14px;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }
    .suggestion-item:hover,
    .suggestion-item.active {
      background: var(--accent-soft);
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    /* Dates modal */
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-btn {
      font-weight: 600;
      font-size: 13px;
      padding: 9px 12px;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .mode-btn:not(.active) {
      background: #fff;
      color: var(--text);
      border-color: #cfd5db;
    }
    .dates-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .dates-preview {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--accent-soft);
      border-radius: 8px;
      font-size: 13px;
      color: var(--accent);
      display: none;
    }
    .dates-preview.visible { display: block; }
    .dates-status {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .dates-status.success { color: var(--accent); font-weight: 600; }
    .dates-status.err     { color: var(--danger); font-weight: 600; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .grid,
      .controls,
      .modal-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="header">
        <div>
          <h1>Orchard Assignments</h1>
          <div class="sub">Click any slot to add, change, or remove a name.</div>
        </div>
        <button id="manageDatesBtn" type="button" class="btn-manage">⚙ Manage Dates</button>
      </div>
      <div class="controls">
        <div class="field">
          <label for="serviceDate">Service Date</label>
          <input id="serviceDate" type="date" />
        </div>
        <div class="field">
          <label for="shiftCode">Shift</label>
          <select id="shiftCode">
            <option value="PM" selected>PM</option>
            <option value="AM">AM</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="loadBtn" type="button">Load Assignments</button>
        </div>
      </div>
      <div id="status" class="status"></div>
      <div id="boardMeta" class="board-meta"></div>
      <div class="helper">Tap or click a slot to edit it.</div>
      <div class="grid">
        <div class="column">
          <h2>Check In</h2>
          <div id="check_in"></div>
        </div>
        <div class="column">
          <h2>Parking</h2>
          <div id="parking"></div>
        </div>
        <div class="column">
          <h2>Greeter</h2>
          <div id="greeter"></div>
        </div>
        <div class="column">
          <h2>Transport</h2>
          <div id="transport"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Assignment edit modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Edit Assignment</div>
        <div id="modalSub" class="modal-sub"></div>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="nameInput">Volunteer Name</label>
          <input
            id="nameInput"
            type="text"
            placeholder="Type a few letters to search names"
            autocomplete="off"
          />
          <div id="nameSuggestions" class="suggestions"></div>
          <div class="hint">Start typing and choose a matching volunteer name.</div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="saveBtn" type="button">Save</button>
        <button id="clearBtn" type="button" class="btn-danger">Remove</button>
        <button id="cancelBtn" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Manage Dates modal -->
  <div id="datesModalBackdrop" class="modal-backdrop">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <div class="modal-title">Manage Service Dates</div>
        <div class="modal-sub">Add dates to the schedule so volunteers can sign up.</div>
      </div>
      <div class="modal-body">
        <!-- Mode toggle -->
        <div class="mode-toggle">
          <button type="button" id="modeSingleBtn" class="mode-btn active">Single Date</button>
          <button type="button" id="modeRecurBtn"  class="mode-btn">Recurring</button>
        </div>

        <!-- Single date mode -->
        <div id="singleMode">
          <div class="field">
            <label for="singleDateInput">Date</label>
            <input type="date" id="singleDateInput" />
          </div>
        </div>

        <!-- Recurring mode -->
        <div id="recurMode" style="display:none;">
          <div class="dates-field-row">
            <div class="field">
              <label for="recurStartInput">Start Date</label>
              <input type="date" id="recurStartInput" />
            </div>
            <div class="field">
              <label for="recurEndInput">End Date</label>
              <input type="date" id="recurEndInput" />
            </div>
          </div>
          <div class="field" style="margin-top:12px;">
            <label for="recurDayInput">Day of Week</label>
            <select id="recurDayInput">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3" selected>Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
          </div>
          <div id="datesPreview" class="dates-preview"></div>
        </div>

        <!-- Season (shared) -->
        <div class="field" style="margin-top:14px;">
          <label for="seasonInput">Season</label>
          <select id="seasonInput">
            <option value="Assignments">Assignments</option>
            <option value="Thinning">Thinning</option>
            <option value="Harvest">Harvest</option>
          </select>
        </div>

        <div id="datesStatus" class="dates-status"></div>
      </div>
      <div class="modal-actions two-col">
        <button id="addDatesBtn" type="button">Add Date(s)</button>
        <button id="cancelDatesBtn" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL      = 'https://tfkdkekvtuqepjqsgjoc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JRFxF6A8mDcZX2D05CdoCQ_F6_rDbwh';
    const READ_SOURCE       = 'assignment_grid_rows';
    const WRITE_TABLE       = 'assignments';
    const VOLUNTEER_TABLE   = 'volunteers';
    const SERVICE_DAYS      = 'service_days';
    const ROLE_ORDER        = ['check_in', 'parking', 'greeter', 'transport'];
    const ROLE_LABELS       = {
      check_in:  'Check In',
      parking:   'Parking',
      greeter:   'Greeter',
      transport: 'Transport'
    };
    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    const roleContainers = {
      check_in:  document.getElementById('check_in'),
      parking:   document.getElementById('parking'),
      greeter:   document.getElementById('greeter'),
      transport: document.getElementById('transport')
    };

    const statusEl        = document.getElementById('status');
    const boardMetaEl     = document.getElementById('boardMeta');
    const serviceDateEl   = document.getElementById('serviceDate');
    const shiftCodeEl     = document.getElementById('shiftCode');
    const loadBtn         = document.getElementById('loadBtn');
    const modalBackdrop   = document.getElementById('modalBackdrop');
    const modalTitle      = document.getElementById('modalTitle');
    const modalSub        = document.getElementById('modalSub');
    const nameInput       = document.getElementById('nameInput');
    const nameSuggestions = document.getElementById('nameSuggestions');
    const saveBtn         = document.getElementById('saveBtn');
    const clearBtn        = document.getElementById('clearBtn');
    const cancelBtn       = document.getElementById('cancelBtn');

    // Dates modal elements
    const manageDatesBtn      = document.getElementById('manageDatesBtn');
    const datesModalBackdrop  = document.getElementById('datesModalBackdrop');
    const modeSingleBtn       = document.getElementById('modeSingleBtn');
    const modeRecurBtn        = document.getElementById('modeRecurBtn');
    const singleMode          = document.getElementById('singleMode');
    const recurMode           = document.getElementById('recurMode');
    const singleDateInput     = document.getElementById('singleDateInput');
    const recurStartInput     = document.getElementById('recurStartInput');
    const recurEndInput       = document.getElementById('recurEndInput');
    const recurDayInput       = document.getElementById('recurDayInput');
    const seasonInput         = document.getElementById('seasonInput');
    const datesPreview        = document.getElementById('datesPreview');
    const datesStatus         = document.getElementById('datesStatus');
    const addDatesBtn         = document.getElementById('addDatesBtn');
    const cancelDatesBtn      = document.getElementById('cancelDatesBtn');

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeSlot = null;
    let volunteerNames = [];
    let filteredSuggestions = [];
    let highlightedSuggestionIndex = -1;
    let datesModalMode = 'single';

    // ── Next Wednesday ──────────────────────────────────────────
    function nextWednesday() {
      const today = new Date();
      const day   = today.getDay();
      const daysUntilWed = day === 3 ? 0 : (3 - day + 7) % 7;
      const next  = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate() + daysUntilWed
      );
      return toDateStr(next);
    }

    function toDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // ── Utilities ───────────────────────────────────────────────
    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function getBoardContext() {
      return {
        service_date: serviceDateEl.value,
        shift_code:   shiftCodeEl.value
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&',  '&amp;')
        .replaceAll('<',  '&lt;')
        .replaceAll('>',  '&gt;')
        .replaceAll('"',  '&quot;')
        .replaceAll("'", '&#039;');
    }

    // ── Board rendering ─────────────────────────────────────────
    function emptyBoard() {
      ROLE_ORDER.forEach(role => {
        roleContainers[role].innerHTML = '';
        for (let slot = 1; slot <= 8; slot += 1) {
          roleContainers[role].appendChild(buildSlotElement(role, slot, null));
        }
      });
    }

    function buildSlotElement(role, slot, row) {
      const rowEl  = document.createElement('div');
      rowEl.className = 'slot';
      const name    = row?.full_name || 'Open';
      const isEmpty = !row;
      rowEl.innerHTML = `
        <div class="slot-num">${slot}</div>
        <div class="slot-name ${isEmpty ? 'empty' : ''}">${escapeHtml(name)}</div>
      `;
      rowEl.addEventListener('click', () => openEditor(role, slot, row));
      return rowEl;
    }

    function renderBoard(rows, serviceDate, shiftCode) {
      const byRoleAndSlot = new Map();
      (rows || []).forEach(row => {
        byRoleAndSlot.set(`${row.assignment_role}:${row.assignment_slot}`, row);
      });
      ROLE_ORDER.forEach(role => {
        const container = roleContainers[role];
        container.innerHTML = '';
        for (let slot = 1; slot <= 8; slot += 1) {
          const key   = `${role}:${slot}`;
          const match = byRoleAndSlot.get(key) || null;
          container.appendChild(buildSlotElement(role, slot, match));
        }
      });
      boardMetaEl.textContent = `${serviceDate} • ${shiftCode}`;
    }

    // ── Assignment edit modal ───────────────────────────────────
    function openEditor(role, slot, row) {
      const { service_date, shift_code } = getBoardContext();
      if (!service_date) {
        setStatus('Choose a service date first.', true);
        return;
      }
      activeSlot  = { role, slot, row };
      modalTitle.textContent = `${ROLE_LABELS[role]} — Slot ${slot}`;
      modalSub.textContent   = `${service_date} • ${shift_code}`;
      nameInput.value        = row?.full_name || '';
      hideSuggestions();
      modalBackdrop.classList.add('open');
      setTimeout(() => { nameInput.focus(); nameInput.select(); }, 10);
    }

    function closeEditor() {
      modalBackdrop.classList.remove('open');
      activeSlot  = null;
      nameInput.value = '';
      hideSuggestions();
    }

    // ── Suggestions ─────────────────────────────────────────────
    function hideSuggestions() {
      filteredSuggestions        = [];
      highlightedSuggestionIndex = -1;
      nameSuggestions.innerHTML  = '';
      nameSuggestions.classList.remove('open');
    }

    function showSuggestions(items) {
      filteredSuggestions        = items;
      highlightedSuggestionIndex = -1;
      if (!items.length) { hideSuggestions(); return; }
      nameSuggestions.innerHTML = items.map((name, index) => `
        <div class="suggestion-item" data-index="${index}">
          ${escapeHtml(name)}
        </div>
      `).join('');
      nameSuggestions.classList.add('open');
      Array.from(nameSuggestions.querySelectorAll('.suggestion-item')).forEach(item => {
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          pickSuggestion(Number(item.dataset.index));
        });
      });
    }

    function updateSuggestionHighlight() {
      const items = nameSuggestions.querySelectorAll('.suggestion-item');
      items.forEach((item, index) => {
        item.classList.toggle('active', index === highlightedSuggestionIndex);
      });
    }

    function pickSuggestion(index) {
      if (index < 0 || index >= filteredSuggestions.length) return;
      nameInput.value = filteredSuggestions[index];
      hideSuggestions();
    }

    function getNameMatches(term) {
      const q = term.trim().toLowerCase();
      if (!q) return [];
      const startsWith = [];
      const contains   = [];
      for (const name of volunteerNames) {
        const lower = name.toLowerCase();
        if (lower.startsWith(q))      { startsWith.push(name); }
        else if (lower.includes(q))   { contains.push(name); }
      }
      return [...startsWith, ...contains].slice(0, 12);
    }

    // ── Data loading ────────────────────────────────────────────
    async function loadVolunteerNames() {
      try {
        const { data, error } = await client
          .from(VOLUNTEER_TABLE)
          .select('full_name')
          .order('full_name', { ascending: true });
        if (error) throw error;
        volunteerNames = [...new Set(
          (data || [])
            .map(row => row.full_name)
            .filter(Boolean)
            .map(name => name.trim())
            .filter(Boolean)
        )];
      } catch (err) {
        console.error(err);
        setStatus(`Volunteer names could not be loaded: ${err.message}`, true);
      }
    }

    async function loadAssignments() {
      const { service_date, shift_code } = getBoardContext();
      if (!service_date) {
        setStatus('Choose a service date first.', true);
        return;
      }
      setStatus('Loading...');
      boardMetaEl.textContent = '';
      try {
        const { data, error } = await client
          .from(READ_SOURCE)
          .select(`
            assignment_id,
            service_date,
            shift_code,
            shift_label,
            assignment_role,
            assignment_slot,
            full_name,
            phone,
            email,
            status
          `)
          .eq('service_date', service_date)
          .eq('shift_code',   shift_code)
          .order('assignment_role', { ascending: true })
          .order('assignment_slot', { ascending: true });
        if (error) throw error;
        renderBoard(data || [], service_date, shift_code);
        setStatus(`${(data || []).length} assignment row(s) loaded.`);
      } catch (err) {
        console.error(err);
        setStatus(`Load failed: ${err.message}`, true);
        emptyBoard();
      }
    }

    // ── Get or create service day ────────────────────────────────
    async function getOrCreateServiceDay(service_date) {
      // Try to find existing row
      const { data: existing, error: findError } = await client
        .from(SERVICE_DAYS)
        .select('id')
        .eq('service_date', service_date)
        .maybeSingle();
      if (findError) throw findError;
      if (existing) return existing;

      // Not found — create it automatically
      const date    = new Date(service_date + 'T12:00:00');
      const dayName = DAY_NAMES[date.getDay()];
      const { data: created, error: insertError } = await client
        .from(SERVICE_DAYS)
        .insert({
          service_date,
          day_name:  dayName,
          open:      true,
          am_open:   true,
          pm_open:   true,
          season:    'Assignments'
        })
        .select('id')
        .single();
      if (insertError) throw insertError;
      return created;
    }

    // ── Save / Remove ───────────────────────────────────────────
    async function saveAssignment() {
      if (!activeSlot) return;
      const fullName = nameInput.value.trim();
      const { service_date, shift_code } = getBoardContext();
      if (!fullName) {
        setStatus('Enter a name or use Remove.', true);
        return;
      }
      setStatus('Saving...');
      try {
        const serviceDay = await getOrCreateServiceDay(service_date);

        const { data: shiftRow, error: shiftError } = await client
          .from('shifts')
          .select('id')
          .eq('code', shift_code)
          .single();
        if (shiftError) throw shiftError;

        const { data: volunteerRow } = await client
          .from(VOLUNTEER_TABLE)
          .select('id')
          .eq('full_name', fullName)
          .maybeSingle();

        const payload = {
          service_day_id:     serviceDay.id,
          shift_id:           shiftRow.id,
          volunteer_id:       volunteerRow?.id || null,
          full_name_snapshot: fullName,
          assignment_role:    activeSlot.role,
          assignment_slot:    activeSlot.slot
        };

        const { error } = await client
          .from(WRITE_TABLE)
          .upsert(payload, {
            onConflict: 'service_day_id,shift_id,assignment_role,assignment_slot'
          });
        if (error) throw error;

        closeEditor();
        await loadAssignments();
        setStatus(`Saved ${fullName}.`);
      } catch (err) {
        console.error(err);
        setStatus(`Save failed: ${err.message}`, true);
      }
    }

    async function removeAssignment() {
      if (!activeSlot) return;
      const { service_date, shift_code } = getBoardContext();
      setStatus('Removing...');
      try {
        const { data: serviceDay, error: serviceDayError } = await client
          .from(SERVICE_DAYS)
          .select('id')
          .eq('service_date', service_date)
          .maybeSingle();
        if (serviceDayError) throw serviceDayError;
        if (!serviceDay) { closeEditor(); setStatus('Nothing to remove.'); return; }

        const { data: shiftRow, error: shiftError } = await client
          .from('shifts')
          .select('id')
          .eq('code', shift_code)
          .single();
        if (shiftError) throw shiftError;

        const { error } = await client
          .from(WRITE_TABLE)
          .delete()
          .eq('service_day_id',   serviceDay.id)
          .eq('shift_id',         shiftRow.id)
          .eq('assignment_role',  activeSlot.role)
          .eq('assignment_slot',  activeSlot.slot);
        if (error) throw error;

        closeEditor();
        await loadAssignments();
        setStatus('Assignment removed.');
      } catch (err) {
        console.error(err);
        setStatus(`Remove failed: ${err.message}`, true);
      }
    }

    // ── Manage Dates modal ───────────────────────────────────────
    function openDatesModal() {
      singleDateInput.value = serviceDateEl.value || nextWednesday();
      recurStartInput.value = nextWednesday();
      recurEndInput.value   = '';
      datesStatus.textContent = '';
      datesStatus.className   = 'dates-status';
      datesPreview.textContent = '';
      datesPreview.classList.remove('visible');
      datesModalBackdrop.classList.add('open');
    }

    function closeDatesModal() {
      datesModalBackdrop.classList.remove('open');
    }

    function setDatesMode(mode) {
      datesModalMode = mode;
      if (mode === 'single') {
        singleMode.style.display = '';
        recurMode.style.display  = 'none';
        modeSingleBtn.classList.add('active');
        modeRecurBtn.classList.remove('active');
      } else {
        singleMode.style.display = 'none';
        recurMode.style.display  = '';
        modeSingleBtn.classList.remove('active');
        modeRecurBtn.classList.add('active');
        updateDatesPreview();
      }
    }

    function getRecurringDates(startStr, endStr, dayOfWeek) {
      if (!startStr || !endStr) return [];
      const start = new Date(startStr + 'T12:00:00');
      const end   = new Date(endStr   + 'T12:00:00');
      if (end < start) return [];
      const dow  = parseInt(dayOfWeek, 10);
      const dates = [];
      const cur  = new Date(start);
      while (cur.getDay() !== dow) cur.setDate(cur.getDate() + 1);
      while (cur <= end) {
        dates.push(toDateStr(cur));
        cur.setDate(cur.getDate() + 7);
      }
      return dates;
    }

    function updateDatesPreview() {
      if (datesModalMode !== 'recur') return;
      const dates = getRecurringDates(recurStartInput.value, recurEndInput.value, recurDayInput.value);
      if (!dates.length) {
        datesPreview.textContent = 'No dates in range yet.';
        datesPreview.classList.add('visible');
      } else {
        datesPreview.textContent = `Will add ${dates.length} date(s): ${dates.join(', ')}`;
        datesPreview.classList.add('visible');
      }
    }

    function setDatesStatus(msg, type = '') {
      datesStatus.textContent = msg;
      datesStatus.className   = 'dates-status' + (type ? ` ${type}` : '');
    }

    async function addDates() {
      const season = seasonInput.value;
      let datesToAdd = [];

      if (datesModalMode === 'single') {
        if (!singleDateInput.value) {
          setDatesStatus('Choose a date.', 'err');
          return;
        }
        datesToAdd = [singleDateInput.value];
      } else {
        datesToAdd = getRecurringDates(recurStartInput.value, recurEndInput.value, recurDayInput.value);
        if (!datesToAdd.length) {
          setDatesStatus('No dates in range. Check start/end dates.', 'err');
          return;
        }
      }

      setDatesStatus(`Adding ${datesToAdd.length} date(s)…`);
      addDatesBtn.disabled = true;

      try {
        const rows = datesToAdd.map(dateStr => {
          const date = new Date(dateStr + 'T12:00:00');
          return {
            service_date: dateStr,
            day_name:     DAY_NAMES[date.getDay()],
            open:         true,
            am_open:      true,
            pm_open:      true,
            season
          };
        });

        const { error } = await client
          .from(SERVICE_DAYS)
          .upsert(rows, { onConflict: 'service_date' });
        if (error) throw error;

        setDatesStatus(`✓ ${datesToAdd.length} date(s) added successfully.`, 'success');

        // Reload assignments if the current date was among those added
        if (datesToAdd.includes(serviceDateEl.value)) {
          await loadAssignments();
        }

        setTimeout(closeDatesModal, 1500);
      } catch (err) {
        console.error(err);
        setDatesStatus(`Error: ${err.message}`, 'err');
      } finally {
        addDatesBtn.disabled = false;
      }
    }

    // ── Event wiring ────────────────────────────────────────────
    nameInput.addEventListener('input', () => {
      showSuggestions(getNameMatches(nameInput.value));
    });

    nameInput.addEventListener('keydown', (e) => {
      if (!filteredSuggestions.length) {
        if (e.key === 'Enter')  { e.preventDefault(); saveAssignment(); }
        if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightedSuggestionIndex =
          highlightedSuggestionIndex < filteredSuggestions.length - 1
            ? highlightedSuggestionIndex + 1 : 0;
        updateSuggestionHighlight();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightedSuggestionIndex =
          highlightedSuggestionIndex > 0
            ? highlightedSuggestionIndex - 1 : filteredSuggestions.length - 1;
        updateSuggestionHighlight();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (highlightedSuggestionIndex >= 0) {
          pickSuggestion(highlightedSuggestionIndex);
        } else {
          saveAssignment();
        }
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        if (filteredSuggestions.length) { hideSuggestions(); } else { closeEditor(); }
      }
    });

    document.addEventListener('click', (e) => {
      const clickedInsideInput = e.target === nameInput;
      const clickedSuggestion  = nameSuggestions.contains(e.target);
      if (!clickedInsideInput && !clickedSuggestion) { hideSuggestions(); }
    });

    loadBtn.addEventListener('click', loadAssignments);
    saveBtn.addEventListener('click', saveAssignment);
    clearBtn.addEventListener('click', removeAssignment);
    cancelBtn.addEventListener('click', closeEditor);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeEditor();
    });
    serviceDateEl.addEventListener('change', loadAssignments);
    shiftCodeEl.addEventListener('change',   loadAssignments);

    // Dates modal
    manageDatesBtn.addEventListener('click', openDatesModal);
    modeSingleBtn.addEventListener('click',  () => setDatesMode('single'));
    modeRecurBtn.addEventListener('click',   () => setDatesMode('recur'));
    [recurStartInput, recurEndInput, recurDayInput].forEach(el =>
      el.addEventListener('change', updateDatesPreview)
    );
    addDatesBtn.addEventListener('click',    addDates);
    cancelDatesBtn.addEventListener('click', closeDatesModal);
    datesModalBackdrop.addEventListener('click', (e) => {
      if (e.target === datesModalBackdrop) closeDatesModal();
    });

    // ── Init ────────────────────────────────────────────────────
    async function init() {
      serviceDateEl.value = nextWednesday();
      emptyBoard();
      await loadVolunteerNames();
      await loadAssignments();
    }

    init();
  </script>
</body>
</html>
